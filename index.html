<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Nieuws in het kort</title>
    <!-- geen referrer: X/Twitter-video weigert anders af te spelen; de YouTube-iframe zet zelf strict-origin-when-cross-origin -->
    <meta name="referrer" content="no-referrer" />
    <meta name="description" content="Het nieuws van vandaag in het kort: Nederland, Tech en AI, Haarlem en omgeving en Showbizz. Met het weer, nieuwsfilmpjes en de toppers van Dumpert. Twee keer per dag bijgewerkt." />
    <link rel="canonical" href="https://nieuwsinkort.nl/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      // thema vóór het renderen zetten (geen witte flits in donkere modus)
      (function () {
        var t = null;
        try { t = localStorage.getItem("nieuwsinkort-thema"); } catch (e) {}
        if (t !== "dark" && t !== "light") t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="nl_NL" />
    <meta property="og:site_name" content="Nieuws in het kort" />
    <meta property="og:title" content="Nieuws in het kort" />
    <meta property="og:description" content="Het nieuws van vandaag in één oogopslag: Nederland, Tech en AI, Haarlem en Showbizz, plus het weer en filmpjes." />
    <meta property="og:url" content="https://nieuwsinkort.nl/" />
    <meta property="og:image" content="https://nieuwsinkort.nl/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nieuws in het kort" />
    <meta name="twitter:description" content="Het nieuws van vandaag in één oogopslag." />
    <meta name="twitter:image" content="https://nieuwsinkort.nl/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>Zet JavaScript aan om het nieuws te zien.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
